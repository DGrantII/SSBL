<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="../CSS/navigation.css" />
    <link rel="stylesheet" href="../CSS/dropdown.css" />
    <script src="https://unpkg.com/axios/dist/axios.min.js" defer></script>
    <script src="../JavaScript/current-game.js" defer></script>
    <title>Current Game</title>
</head>
<body onload="wakeLock(), loadDropdown(), setInitialTeams()">
    <nav>
        <a href="./">Home</a>
        <a href="/modify-stats.html">Modify Stats</a>
        <a class="active" href="/current-game.html">Current Game</a>
        <a href="/schedule.html">Schedule</a>
        <a href="/team-rankings.html">Team Rankings</a>
        <a href="/player-rankings.html">Player Rankings</a>
        <a href="/all-teams.html">All Teams</a>
        <a class="extras" href="/archives/archives.html">Archives</a>
        <a class="extras" href="/modify/modify.html">Modify</a>
        <a class="extras" href="/offseason/lock-mvps.html">Offseason</a>
        <a class="extras" href="/playoffs/bracket.html">Playoffs</a>
    </nav>
    <div class="dropdown">
        <button class="dropbtn" id="awayButton" onclick="reveal('awayDropdown')">Away</button>
        <div class="dropdown-content" id="awayDropdown">

        </div>
    </div>
    <div class="dropdown" id="home-div">
        <button class="dropbtn" id="homeButton" onclick="reveal('homeDropdown')">Home</button>
        <div class="dropdown-content" id="homeDropdown">

        </div>
    </div>
    <div id="mainWrapper" onclick="hide('awayDropdown', 'homeDropdown')">
        <img src="http://localhost:3000/images/SSBLlogo.png" alt="SSBL Logo" />
        <table>
            <tr>
                <td class="imageWrapper">
                    <img id="awayLogo" src="http://localhost:3000/images/QuestionMark.png"/>
                </td>
                <td id="versus">V.S</td>
                <td class="imageWrapper">
                    <img id="homeLogo" src="http://localhost:3000/images/QuestionMark.png"/>
                </td>
            </tr>
            <tr>
                <td class="imageWrapper">
                    <p id="away"></p>
                </td>
                <td></td>
                <td class="imageWrapper">
                    <p id="home"></p>
                </td>
            </tr>
        </table>
        <p id="location"></p>
    </div>
</body>
</html>
